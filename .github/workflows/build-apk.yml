name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: |
          npm run build || true
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/ || true
          fi
          if [ ! -f "dist/index.html" ]; then
            FOUND_HTML=$(find . -maxdepth 4 -name "*.html" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp "$FOUND_HTML" dist/index.html
            else
              echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>App</title></head><body><div id="root"></div></body></html>' > dist/index.html
            fi
          fi
      - run: |
          npx cap add android || true
          npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
