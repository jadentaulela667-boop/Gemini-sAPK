name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Helper Scripts
        run: |
          cat << 'JS_EOF' > fix-dist.cjs
          const fs = require('fs');
          const path = require('path');

          const distDir = path.join(__dirname, 'dist');
          const assetsDir = path.join(distDir, 'assets');

          if (!fs.existsSync(distDir)) {
            fs.mkdirSync(distDir, { recursive: true });
          }

          let htmlPath = path.join(distDir, 'index.html');
          let htmlContent = '';

          const candidatePaths = [
            htmlPath,
            path.join(__dirname, 'index.html'),
            path.join(__dirname, 'public', 'index.html'),
            path.join(__dirname, 'src', 'index.html')
          ];

          for (const p of candidatePaths) {
            if (fs.existsSync(p)) {
              htmlContent = fs.readFileSync(p, 'utf8');
              break;
            }
          }

          let cssFiles = [];
          let jsFiles = [];
          if (fs.existsSync(assetsDir)) {
            const files = fs.readdirSync(assetsDir);
            cssFiles = files.filter(f => f.endsWith('.css'));
            jsFiles = files.filter(f => f.endsWith('.js'));
          }

          if (!htmlContent.trim()) {
            htmlContent = '<!DOCTYPE html>\n<html lang="en" class="dark">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">\n  <title>Meridian</title>\n</head>\n<body class="bg-black text-white">\n  <div id="root"></div>\n  <div id="app"></div>\n</body>\n</html>';
          }

          cssFiles.forEach(css => {
            if (!htmlContent.includes(css)) {
              htmlContent = htmlContent.replace('</head>', '  <link rel="stylesheet" href="./assets/' + css + '">\n</head>');
            }
          });

          jsFiles.forEach(js => {
            if (!htmlContent.includes(js)) {
              htmlContent = htmlContent.replace('</body>', '  <script type="module" src="./assets/' + js + '"></script>\n</body>');
            }
          });

          htmlContent = htmlContent.replace(/href="\/assets\//g, 'href="./assets/');
          htmlContent = htmlContent.replace(/src="\/assets\//g, 'src="./assets/');
          htmlContent = htmlContent.replace(/href="\/favicon/g, 'href="./favicon');

          fs.writeFileSync(htmlPath, htmlContent, 'utf8');
          console.log('Dist directory patched successfully.');
          JS_EOF

          cat << 'MANIFEST_EOF' > fix-manifest.cjs
          const fs = require('fs');
          const path = require('path');

          const manifestPath = path.join(__dirname, 'android', 'app', 'src', 'main', 'AndroidManifest.xml');
          if (fs.existsSync(manifestPath)) {
            let content = fs.readFileSync(manifestPath, 'utf8');
            if (!content.includes('usesCleartextTraffic')) {
              content = content.replace('<application', '<application android:usesCleartextTraffic="true"');
              fs.writeFileSync(manifestPath, content, 'utf8');
              console.log('AndroidManifest patched for cleartext traffic.');
            }
          }
          MANIFEST_EOF

      - name: Build Web Application
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/meridian"
          NODE_ENV: "production"
          VITE_APP_MODE: "standalone"
        run: |
          npx vite build || npm run build || true

      - name: Bundle Static Assets and Fix Paths
        run: |
          mkdir -p dist
          [ -d ".vercel/output/static" ] && cp -r .vercel/output/static/* dist/ || true
          [ -d ".output/public" ] && cp -r .output/public/* dist/ || true
          [ -d "dist/client" ] && cp -r dist/client/* dist/ || true
          [ -d "public" ] && cp -r public/* dist/ 2>/dev/null || true
          node fix-dist.cjs

      - name: Configure Capacitor Android
        run: |
          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            }
          }
          CAP_EOF

          npx cap add android || true
          npx cap sync android

      - name: Configure Gradle & Android Permissions
        run: |
          if [ -f "android/app/build.gradle" ]; then
            echo '' >> android/app/build.gradle
            echo 'configurations.all {' >> android/app/build.gradle
            echo '    resolutionStrategy.eachDependency { details ->' >> android/app/build.gradle
            echo '        if (details.requested.group == "org.jetbrains.kotlin" && (details.requested.name == "kotlin-stdlib-jdk7" || details.requested.name == "kotlin-stdlib-jdk8")) {' >> android/app/build.gradle
            echo '            details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"' >> android/app/build.gradle
            echo '        }' >> android/app/build.gradle
            echo '    }' >> android/app/build.gradle
            echo '}' >> android/app/build.gradle
          fi

          node fix-manifest.cjs

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
