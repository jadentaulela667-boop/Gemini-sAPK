name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        run: |
          # 1. Run Vite build directly to bypass database migrations
          npx vite build || true

          # 2. Extract compiled Meridian assets from Vercel/Nitro output
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/
          fi
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi

          echo "=== Verified dist output ==="
          ls -la dist/

      - name: Sync Capacitor
        run: |
          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist"
          }
          CAP_EOF

          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
