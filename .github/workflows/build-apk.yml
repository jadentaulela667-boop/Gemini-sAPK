name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application & Bundle All Assets
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/meridian"
          NODE_ENV: "production"
        run: |
          echo "=== 1. Compiling Meridian Vite frontend ==="
          if [ -f "scripts/with-app-env.mjs" ]; then
            node scripts/with-app-env.mjs vite build || npx vite build || true
          else
            npx vite build || true
          fi

          echo "=== 2. Assembling complete dist directory ==="
          mkdir -p dist

          if [ -d "public" ]; then
            echo "Including public assets..."
            cp -r public/* dist/ 2>/dev/null || true
          fi

          if [ -d ".vercel/output/static" ]; then
            echo "Including .vercel/output/static..."
            cp -r .vercel/output/static/* dist/ 2>/dev/null || true
          fi

          if [ -d ".output/public" ]; then
            echo "Including .output/public..."
            cp -r .output/public/* dist/ 2>/dev/null || true
          fi

          if [ -d "dist/client" ]; then
            echo "Including dist/client..."
            cp -r dist/client/* dist/ 2>/dev/null || true
          fi

          echo "=== 3. Linking assets to index.html ==="
          node -e '
            const fs = require("fs");
            const path = require("path");

            const distDir = path.join(process.cwd(), "dist");
            const assetsDir = path.join(distDir, "assets");

            let htmlPath = path.join(distDir, "index.html");
            let htmlContent = "";

            const possibleHtmlPaths = [
              path.join(distDir, "index.html"),
              path.join(process.cwd(), "index.html"),
              path.join(process.cwd(), "public", "index.html"),
              path.join(process.cwd(), "src", "index.html")
            ];

            for (const p of possibleHtmlPaths) {
              if (fs.existsSync(p)) {
                htmlContent = fs.readFileSync(p, "utf8");
                break;
              }
            }

            if (!htmlContent.trim()) {
              htmlContent = `<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Meridian</title>
            </head>
            <body class="bg-black text-white">
              <div id="root"></div>
              <div id="app"></div>
            </body>
            </html>`;
            }

            if (fs.existsSync(assetsDir)) {
              const files = fs.readdirSync(assetsDir);
              const cssFiles = files.filter(f => f.endsWith(".css"));
              const jsFiles = files.filter(f => f.endsWith(".js"));

              cssFiles.forEach(css => {
                if (!htmlContent.includes(css)) {
                  htmlContent = htmlContent.replace("</head>", `  <link rel="stylesheet" href="./assets/${css}">\n</head>`);
                }
              });

              jsFiles.forEach(js => {
                if (!htmlContent.includes(js)) {
                  htmlContent = htmlContent.replace("</body>", `  <script type="module" src="./assets/${js}"></script>\n</body>`);
                }
              });
            }

            htmlContent = htmlContent.replace(/href="\/assets\//g, "href=\"./assets/");
            htmlContent = htmlContent.replace(/src="\/assets\//g, "src=\"./assets/");
            htmlContent = htmlContent.replace(/href="\/favicon/g, "href=\"./favicon");

            fs.writeFileSync(htmlPath, htmlContent, "utf8");
          '

          echo "=== 4. Final dist bundle verification ==="
          du -sh dist/
          find dist -maxdepth 3

      - name: Sync Capacitor
        run: |
          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          CAP_EOF

          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
