name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Assets
        run: |
          npm run build || npx vite build || true
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/ || true
          fi
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/ || true
          fi
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/ || true
          fi
          INDEX_FILE=$(find . -maxdepth 4 -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "./dist/*" | head -n 1)
          if [ -n "$INDEX_FILE" ]; then
            SRC_DIR=$(dirname "$INDEX_FILE")
            if [ "$SRC_DIR" != "./dist" ] && [ "$SRC_DIR" != "dist" ]; then
              cp -r "$SRC_DIR"/* dist/ || true
            fi
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meridian</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
