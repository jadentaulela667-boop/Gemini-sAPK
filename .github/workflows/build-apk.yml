name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/meridian"
          NODE_ENV: "production"
          VITE_APP_MODE: "standalone"
        run: |
          echo "=== 1. Compiling Frontend Assets ==="
          npx vite build

          echo "=== 2. Assembling Static Distribution Directory ==="
          mkdir -p dist

          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/
          fi
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/
          fi
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi
          if [ -d "public" ]; then
            cp -r public/* dist/ 2>/dev/null || true
          fi

          echo "=== 3. Fixing Asset Paths for Android WebView ==="
          node -e '
            const fs = require("fs");
            const path = require("path");

            const distDir = path.join(process.cwd(), "dist");
            const assetsDir = path.join(distDir, "assets");

            let htmlPath = path.join(distDir, "index.html");
            let htmlContent = "";

            const candidatePaths = [
              path.join(distDir, "index.html"),
              path.join(process.cwd(), "index.html"),
              path.join(process.cwd(), "public", "index.html"),
              path.join(process.cwd(), "src", "index.html")
            ];

            for (const p of candidatePaths) {
              if (fs.existsSync(p)) {
                htmlContent = fs.readFileSync(p, "utf8");
                break;
              }
            }

            let cssFiles = [];
            let jsFiles = [];
            if (fs.existsSync(assetsDir)) {
              const files = fs.readdirSync(assetsDir);
              cssFiles = files.filter(f => f.endsWith(".css"));
              jsFiles = files.filter(f => f.endsWith(".js"));
            }

            console.log("CSS Bundles:", cssFiles);
            console.log("JS Bundles:", jsFiles);

            if (!htmlContent.trim()) {
              htmlContent = `<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meridian - Market Analysis Desk</title>
  <style>
    body, html { margin: 0; padding: 0; background-color: #09090b; color: #ffffff; height: 100%; width: 100%; overflow: hidden; }
    #root, #app { height: 100%; width: 100%; }
  </style>
</head>
<body class="bg-black text-white">
  <div id="root"></div>
  <div id="app"></div>
</body>
</html>`;
            }

            cssFiles.forEach(css => {
              if (!htmlContent.includes(css)) {
                htmlContent = htmlContent.replace("</head>", `  <link rel="stylesheet" href="./assets/${css}">\n</head>`);
              }
            });

            jsFiles.forEach(js => {
              if (!htmlContent.includes(js)) {
                htmlContent = htmlContent.replace("</body>", `  <script type="module" src="./assets/${js}"></script>\n</body>`);
              }
            });

            htmlContent = htmlContent.replace(/href="\/assets\//g, "href=\"./assets/");
            htmlContent = htmlContent.replace(/src="\/assets\//g, "src=\"./assets/");
            htmlContent = htmlContent.replace(/href="\/favicon/g, "href=\"./favicon");

            fs.writeFileSync(htmlPath, htmlContent, "utf8");
            console.log("Prepared relative asset entry index.html successfully.");
          '

          ls -la dist/
          if [ -d "dist/assets" ]; then
            ls -la dist/assets/
          fi

      - name: Configure Capacitor Android
        run: |
          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            }
          }
          CAP_EOF

          npx cap add android || true
          npx cap sync android

      - name: Configure Gradle & Android Permissions
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            node -e '
              const fs = require("fs");
              let m = fs.readFileSync("'$MANIFEST'", "utf8");
              if (!m.includes("usesCleartextTraffic")) {
                m = m.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
                fs.writeFileSync("'$MANIFEST'", m);
              }
            '
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
