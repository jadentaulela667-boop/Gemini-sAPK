name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application & Assemble Dist
        run: |
          # 1. Compile web assets
          npx vite build || npm run build || true

          # 2. Gather static assets into dist
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/
          fi
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/
          fi
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi

          # 3. Generate guaranteed index.html linked to compiled app assets
          node -e '
            const fs = require("fs");
            const path = require("path");

            const distDir = path.join(process.cwd(), "dist");
            const assetsDir = path.join(distDir, "assets");

            if (!fs.existsSync(distDir)) {
              fs.mkdirSync(distDir, { recursive: true });
            }

            let cssFiles = [];
            let jsFiles = [];

            if (fs.existsSync(assetsDir)) {
              const files = fs.readdirSync(assetsDir);
              cssFiles = files.filter(f => f.endsWith(".css"));
              jsFiles = files.filter(f => f.endsWith(".js"));
            }

            console.log("CSS assets found:", cssFiles);
            console.log("JS assets found:", jsFiles);

            let htmlPath = path.join(distDir, "index.html");
            let htmlContent = "";

            if (fs.existsSync(htmlPath)) {
              htmlContent = fs.readFileSync(htmlPath, "utf8");
            }

            if (!htmlContent.trim()) {
              const candidates = ["index.html", "public/index.html", "src/index.html"];
              for (const cand of candidates) {
                if (fs.existsSync(cand)) {
                  htmlContent = fs.readFileSync(cand, "utf8");
                  break;
                }
              }
            }

            if (!htmlContent.trim()) {
              htmlContent = `<!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Meridian</title>
            </head>
            <body class="bg-black text-white">
              <div id="root"></div>
              <div id="app"></div>
            </body>
            </html>`;
            }

            cssFiles.forEach(css => {
              if (!htmlContent.includes(css)) {
                htmlContent = htmlContent.replace("</head>", `  <link rel="stylesheet" href="./assets/${css}">\n</head>`);
              }
            });

            jsFiles.forEach(js => {
              if (!htmlContent.includes(js)) {
                htmlContent = htmlContent.replace("</body>", `  <script type="module" src="./assets/${js}"></script>\n</body>`);
              }
            });

            htmlContent = htmlContent.replace(/href="\/assets\//g, "href=\"./assets/");
            htmlContent = htmlContent.replace(/src="\/assets\//g, "src=\"./assets/");

            fs.writeFileSync(htmlPath, htmlContent, "utf8");
            console.log("Successfully prepared dist/index.html");
          '

          ls -la dist/

      - name: Sync Capacitor
        run: |
          cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist"
          }
          CAP_EOF

          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
