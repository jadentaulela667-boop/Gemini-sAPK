name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Application & Prepare Dist
        run: |
          # 1. Run standard build
          npm run build

          # 2. Locate built index.html
          echo "=== Locating built web application ==="
          FOUND_DIR=""

          if [ -f "dist/index.html" ]; then
            echo "Found index.html in dist/"
            FOUND_DIR="dist"
          elif [ -f "build/index.html" ]; then
            echo "Found index.html in build/"
            FOUND_DIR="build"
          elif [ -f "out/index.html" ]; then
            echo "Found index.html in out/"
            FOUND_DIR="out"
          elif [ -f "www/index.html" ]; then
            echo "Found index.html in www/"
            FOUND_DIR="www"
          else
            SEARCH_RESULT=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/android/*" | head -n 1)
            if [ -n "$SEARCH_RESULT" ]; then
              FOUND_DIR=$(dirname "$SEARCH_RESULT")
              echo "Found index.html in $FOUND_DIR"
            fi
          fi

          if [ -z "$FOUND_DIR" ]; then
            echo "ERROR: Could not find built index.html!"
            find . -maxdepth 3 -not -path '*/.*' -not -path '*/node_modules*'
            exit 1
          fi

          # 3. Copy web bundle to dist if output was elsewhere
          if [ "$FOUND_DIR" != "dist" ]; then
            mkdir -p dist
            cp -r "$FOUND_DIR"/* dist/
          fi

          # 4. Verify index.html exists in dist
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html is missing after copy!"
            exit 1
          fi

          echo "=== Web bundle prepared successfully ==="
          ls -la dist/

      - name: Configure and Sync Capacitor
        run: |
          if [ -f "capacitor.config.json" ]; then
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
              config.webDir = "dist";
              fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
            '
          elif [ -f "capacitor.config.ts" ]; then
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("capacitor.config.ts", "utf8");
              content = content.replace(/webDir:\s*["\x27][^"\x27]+["\x27]/, "webDir: \"dist\"");
              fs.writeFileSync("capacitor.config.ts", content);
            '
          else
            cat << 'CAP_EOF' > capacitor.config.json
          {
            "appId": "com.meridian.app",
            "appName": "Meridian",
            "webDir": "dist"
          }
          CAP_EOF
          fi

          npx cap add android || true
          npx cap sync android

      - name: Configure Gradle and Build APK
        run: |
          if [ -f "android/app/build.gradle" ]; then
            cat << 'GRADLE_EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                     (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}"
                  }
              }
          }
          GRADLE_EOF
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
